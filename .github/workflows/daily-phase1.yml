# 每天北京时间 8:00 在 GitHub Actions 上跑 Phase1 全市场扫描
# 扫描结果（data/seed_pool_*.json）自动 commit 回 main 分支，
# 该 push 会触发 pages.yml 重新发布 GitHub Pages 上的在线 Demo
#
# 启用前：
#   1. 在 GitHub 仓库 Settings → Secrets 添加：TUSHARE_TOKEN, GEMINI_API_KEY 等
#   2. Settings → Actions → General → Workflow permissions 选 "Read and write"

name: Daily Phase1 Screening

on:
  schedule:
    # UTC 00:00 = 北京时间 08:00（周一到周五）
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      target:
        description: 'Phase1 目标种子数'
        default: '100'
      max_codes:
        description: '候选池上限（等距抽样，0=全市场；调试时可设小值快速验证）'
        default: '0'

concurrency:
  group: phase1-screening
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 3小时上限
    # 种子池文件名按运行时的本地日期生成，统一到北京时间，避免跨日错位
    env:
      TZ: Asia/Shanghai

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Phase1
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AIHUBMIX_KEY: ${{ secrets.AIHUBMIX_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STOCK_LIST: ${{ vars.STOCK_LIST || '600519,300750,002594' }}
          MAX_WORKERS: '3'
          PHASE1_MAX_CODES: ${{ github.event.inputs.max_codes || '0' }}
        run: |
          mkdir -p data logs reports
          TARGET="${{ github.event.inputs.target || '100' }}"
          python main.py --phase1 --phase1-target "$TARGET" --workers 8

      # 全市场扫描要跑一个多小时，期间 main 很可能已经前进，
      # 直接 push 会 non-fast-forward 失败并丢掉当天数据，所以带 rebase 重试
      - name: Commit seed pool back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seed_pool_*.json reports/screening/*.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(phase1): seed pool $(TZ=Asia/Shanghai date +%F)"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push 被拒，rebase 到最新 ${GITHUB_REF_NAME} 后重试"
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "::error::种子池提交失败（连续 3 次 push 被拒）"
          exit 1

      # Phase1 拿不到行情时会记 ERROR 后正常退出（0 只入池），
      # 不做校验的话 job 仍是绿的，问题会被掩盖
      - name: Verify seed pool
        run: |
          FILE="data/seed_pool_$(date +%Y%m%d).json"
          if [ ! -s "$FILE" ]; then
            echo "::error::Phase1 未生成 $FILE。常见原因：GitHub 托管 runner 的海外 IP 被 AKShare/东财行情接口拒绝（Connection reset by peer）"
            exit 1
          fi
          COUNT=$(python -c "import json,sys;print(len(json.load(open('$FILE'))['entries']))")
          echo "种子池：$COUNT 只"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::种子池为空"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase1-${{ github.run_number }}
          path: |
            data/seed_pool_*.json
            reports/screening/
            logs/
          retention-days: 14

  # 种子池是用 GITHUB_TOKEN 提交的，这类 push 不会触发 pages.yml，
  # 所以扫描成功后直接调用它把新数据发布到 GitHub Pages
  deploy-demo:
    needs: scan
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
